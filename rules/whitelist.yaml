# skill-safety-guard 白名單：已知誤報模式
# 用途：降低誤報率至 ≤3%（v4 文檔 F-014 驗收標準）

# 規則 ID 白名單：匹配後即使觸發也不報告
# 場景：該規則在特定上下文中是正常的

whitelisted_patterns:
  # 文檔/示例代碼中的占位符
  - rule_id: cred-openai
    pattern: 'sk-example[A-Za-z0-9]+T3BlbkFJ[A-Za-z0-9]+|sk-xxx+|sk-placeholder'
    reason: 文檔示例中的占位符

  - rule_id: cred-anthropic
    pattern: 'sk-ant-api03-example|sk-ant-placeholder'
    reason: 文檔示例中的占位符

  - rule_id: cred-aws-access-key
    pattern: 'AKIAIOSFODNN7EXAMPLE|AKIA0000000000000000'
    reason: AWS 官方文檔示例

  - rule_id: cred-github-token
    pattern: 'ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx|ghp_TOKENPLACEHOLDER'
    reason: 文檔示例占位符

  # 工具自身文檔中的示例（自掃時已知自指誤報）
  - rule_id: cred-openai
    pattern: 'sk-proj-abcdefghijklmnopqrstuvwxyz'
    reason: TESTING.md 中的假金鑰示例（非真實密鑰）

  - rule_id: shell-curl-bash
    pattern: 'https://example\.com'
    reason: TESTING.md 使用 RFC 2606 保留占位域名（https://example.com 裸域）的示例

  - rule_id: shell-curl-bash
    pattern: '危險 Shell 命令（`curl \| bash`'
    match_context: true
    reason: README.md 描述檢測能力的示例行（含中文註記，僅本工具 README 出現）

  # 工具自身源碼中的 FP 判定註釋（paths.py 誤報自動識別邏輯文本自指命中）
  - rule_id: path-env-file
    pattern: '但實際是透過 os\.env'
    reason: paths.py 中誤報判定邏輯的說明文本（非實際訪問 .env）

  # 功能說明書中的檢測能力表格（與 README 同理）
  - rule_id: critical-history-clear
    pattern: '\| \*\*歷史篡改\*\*'
    match_context: true
    reason: 功能說明書.md 中「歷史篡改」檢測能力描述行

  # 測試 fixture 中的真實命中（測試模式下保留所有命中以便驗證）
  # 此項只在 test 模式下生效，生產模式忽略
  - rule_id: '*'
    pattern: '^TEST_MARKER:.*'
    reason: 測試標記（僅 test 模式）

# 路徑白名單：常見誤報路徑（即使命中也不報告）
# 注意：不要列入 tests/fixtures/，否則會過濾掉我們自己的惡意測試樣本
whitelisted_paths:
  - '*/.gitignore'
  - '*/CHANGELOG.md'
  # 安全審計文檔（描述漏洞，不是實際攻擊）
  - '*/SECURITY_AUDIT.md'
  - '*/SECURITY.md'
  - '*/VULNERABILITY_*.md'
  - '*/threat-model.md'
  - '*/docs/security/*'
  # 工具自身內容（自掃時已知自指誤報）：
  # demo/ 是示例報告輸出；docs/scripts 是規則評估與生成腳本；
  # rules/ 下的 yaml 是規則定義本身（模式即數據，掃描必然自指命中）
  - '*/demo/outputs/*.md'
  - '*/demo/index.html'
  - '*/docs/CRITICAL_PATHS_EVALUATION.md'
  - '*/docs/PACKAGE_INTRO.md'  # pi.dev gallery 雙語產品介紹（含 ClawHavoc 攻擊手法示例文案）
  - '*/docs/SELFSCAN_RULES.md'  # 自掃維護規則（含常見誤觸發模式示例，本文件自身必須豁免）
  - '*/demo/web-ui/*'  # Web 界面原型（含 curl|bash 等攻擊示例展示，與 demo/index.html 同理）
  - '*/extension/*'  # Pi 擴展（safety-guard.ts 內含與 rules/dangerous_shell.yaml 相同的正則，掃描必然自指命中）
  - '*/scripts/generate_critical_paths_rules.py'
  - '*/rules/credentials.yaml'
  - '*/rules/sensitive_paths.yaml'
  - '*/rules/critical_paths.yaml'
  - '*/rules/dangerous_shell.yaml'
  - '*/rules/unicode_steganography.yaml'
  - '*/rules/prompt_injection.yaml'
  - '*/rules/mcp.yaml'
  - '*/rules/mcp_injection.yaml'
  - '*/rules/installed_extensions.yaml'
  - '*/rules/privacy.yaml'
  - '*/rules/whitelist.yaml'
  # 掃描報告（描述漏洞，不是實際攻擊；與 SECURITY_AUDIT.md 同理）
  - '*/SCAN_REPORT_*.md'
  - '*/scan-pi-web-*.md'
  - '*/scan-report-*.md'
  - '*/report/*'

# 置信度下調：命中後將置信度從 high 降為 low
confidence_demotions:
  - rule_id: path-env-file
    context: '\.env\.example|\.env\.sample|\.env\.template'
    new_confidence: low
    reason: 可能是 .env.example 模板文件，非真實配置