# skill-safety-guard 規則庫：憑證洩露檢測
# 格式：每條規則含 id、名稱、正則、嚴重度、修復建議
# 嚴重度分級 - 參見 v4 文檔 F-015 置信度分級
#
# YAML 注意事項：正則字符串使用雙引號 + 雙反斜杠轉義

rules:
  - id: cred-openai
    name: OpenAI API Key
    pattern: "sk-[A-Za-z0-9]{20,}T3BlbkFJ[A-Za-z0-9]{20,}|sk-proj-[A-Za-z0-9_-]{40,}|sk-[A-Za-z0-9]{40,}"
    severity: high
    confidence: high
    category: credentials
    description: 疑似 OpenAI API Key 洩露
    remediation: 立即撤銷該密鑰，前往 https://platform.openai.com/api-keys 生成新密鑰

  - id: cred-anthropic
    name: Anthropic API Key
    pattern: "sk-ant-[A-Za-z0-9-]{40,}"
    severity: high
    confidence: high
    category: credentials
    description: 疑似 Anthropic API Key 洩露
    remediation: 立即撤銷該密鑰，前往 https://console.anthropic.com/settings/keys 生成新密鑰

  - id: cred-aws-access-key
    name: AWS Access Key ID
    pattern: "AKIA[0-9A-Z]{16}"
    severity: high
    confidence: high
    category: credentials
    description: 疑似 AWS Access Key ID
    remediation: 在 IAM 控制台刪除該訪問密鑰，並審查 CloudTrail 日誌

  - id: cred-aws-secret
    name: AWS Secret Access Key
    pattern: "(?i)(aws_secret_access_key|aws_secret_key|aws_private_key)['\"\\s:=]+[A-Za-z0-9/+=]{40}"
    severity: high
    confidence: medium
    category: credentials
    description: 疑似 AWS Secret Access Key
    remediation: 立即輪換密鑰，檢查 S3/IAM 異常訪問

  - id: cred-github-token
    name: GitHub Personal Access Token
    pattern: "ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|ghu_[A-Za-z0-9]{36}|ghs_[A-Za-z0-9]{36}|ghr_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}"
    severity: high
    confidence: high
    category: credentials
    description: 疑似 GitHub Token 洩露
    remediation: 前往 https://github.com/settings/tokens 删除并撤销该 token

  - id: cred-slack
    name: Slack Token
    pattern: "xox[baprs]-[0-9a-zA-Z]{10,48}|xoxe\\.xox[bp]-[0-9a-zA-Z=]{100,}"
    severity: high
    confidence: high
    category: credentials
    description: 疑似 Slack Token
    remediation: 在 Slack App 管理頁面撤銷該 token

  - id: cred-stripe
    name: Stripe API Key
    pattern: "sk_live_[0-9a-zA-Z]{24,}|pk_live_[0-9a-zA-Z]{24,}|rk_live_[0-9a-zA-Z]{24,}"
    severity: high
    confidence: high
    category: credentials
    description: 疑似 Stripe API Key（live 環境，影響真實交易）
    remediation: 在 Stripe Dashboard 立即 roll 該密鑰

  - id: cred-google-api
    name: Google API Key
    pattern: "AIza[0-9A-Za-z_-]{35}"
    severity: high
    confidence: high
    category: credentials
    description: 疑似 Google API Key
    remediation: 在 Google Cloud Console 限制或刪除該密鑰

  - id: cred-private-key
    name: PEM Private Key
    pattern: "-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----"
    severity: high
    confidence: high
    category: credentials
    description: 疑似私鑰（PEM 格式）
    remediation: 立即撤銷該私鑰，重新生成

  - id: cred-jwt
    name: JWT Token
    pattern: "eyJ[A-Za-z0-9_-]{10,}\\.eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}"
    severity: medium
    confidence: medium
    category: credentials
    description: 疑似 JWT Token
    remediation: 檢查是否為長期 token，必要時撤銷