<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6×6 數獨 · 暗銀</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:22px 12px;
  color:#c8d0d8;
  background:radial-gradient(1100px 700px at 50% -10%,#1b2129 0%,#0c0f14 55%,#07090c 100%);
}
.wrap{
  width:min(460px,100%);
  border:1px solid rgba(202,212,222,.42);
  border-radius:20px;
  padding:22px 20px 24px;
  background:linear-gradient(165deg,rgba(255,255,255,.05),rgba(255,255,255,0) 30%),rgba(13,17,22,.93);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.09),
    0 0 0 1px rgba(0,0,0,.55),
    0 0 26px rgba(175,195,215,.12),
    0 20px 55px rgba(0,0,0,.6);
}
.topbar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;}
.title{font-size:1.18rem;letter-spacing:.32em;color:#e9eef4;font-weight:600;text-shadow:0 0 12px rgba(190,205,220,.4);}
.title .dot{color:#8fd8ff;}
.clock{
  font-size:1.55rem;font-weight:600;color:#f4f8fc;
  letter-spacing:.06em;font-variant-numeric:tabular-nums;
  text-shadow:0 0 16px rgba(200,222,244,.55);
  white-space:nowrap;
}
.clock .lbl{font-size:.64rem;color:#8b98a6;letter-spacing:.26em;margin-right:8px;font-weight:400;vertical-align:middle;}
.statbar{
  display:flex;justify-content:center;gap:20px;flex-wrap:wrap;
  font-size:.8rem;color:#93a0ad;
  border:1px solid rgba(192,202,214,.24);
  border-radius:999px;padding:8px 18px;margin-bottom:16px;
  background:rgba(255,255,255,.03);
}
.statbar b{color:#e9eef4;font-variant-numeric:tabular-nums;font-weight:600;}
.grid{
  display:grid;grid-template-columns:repeat(6,1fr);
  border:1px solid rgba(204,214,224,.55);
  border-radius:10px;overflow:hidden;
  background:#0d1116;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 8px 22px rgba(0,0,0,.45);
}
.cell{
  position:relative;
  aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.35rem,7.5vw,2.05rem);
  font-weight:600;font-variant-numeric:tabular-nums;
  color:#e9eef4;background:#10151c;
  border:none;outline:none;cursor:pointer;user-select:none;
  border-top:1px solid rgba(150,160,170,.13);
  border-left:1px solid rgba(150,160,170,.13);
  transition:background .15s,color .15s,box-shadow .15s;
}
.cell[data-r="2"],.cell[data-r="4"]{border-top:2px solid rgba(206,216,226,.62);}
.cell[data-c="3"]{border-left:2px solid rgba(206,216,226,.62);}
.cell.given{color:#e9eef4;}
.cell.user{color:#8fd8ff;}
.cell.ok{color:#54ef9f;}
.cell.err{color:#ff6b6b;background:#251318;animation:shake .3s ease;}
.cell.done{color:#ffd76a;text-shadow:0 0 10px rgba(255,200,90,.35);}
.cell.selected{
  background:#1d2836;
  box-shadow:inset 0 0 0 2px rgba(165,220,255,.9),0 0 16px rgba(140,200,255,.4);
  z-index:2;
}
.cell.given.selected{background:#1d2836;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-4px);}
  40%{transform:translateX(4px);}
  60%{transform:translateX(-3px);}
  80%{transform:translateX(3px);}
}
.hint{
  min-height:2.3em;margin:14px 0 12px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:.9rem;color:#93a0ad;
  border:1px solid rgba(192,202,214,.22);
  border-radius:10px;background:rgba(255,255,255,.025);
  padding:8px 12px;
  transition:border-color .2s,color .2s,box-shadow .2s;
}
.hint.ok{color:#54ef9f;border-color:rgba(84,239,159,.45);box-shadow:0 0 16px rgba(84,239,159,.14);}
.hint.err{color:#ff6b6b;border-color:rgba(255,107,107,.45);box-shadow:0 0 16px rgba(255,107,107,.16);}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px;}
.pad button{
  aspect-ratio:1.5;
  border:1px solid rgba(200,210,220,.36);
  border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#1c232d,#12161d);
  color:#dce4eb;font-size:1.1rem;font-weight:600;
  box-shadow:0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);
  transition:all .15s;
}
.pad button:hover{border-color:rgba(190,220,250,.75);color:#fff;transform:translateY(-1px);box-shadow:0 0 16px rgba(150,200,255,.3);}
.pad button:active{transform:translateY(0);}
.actions{display:flex;gap:10px;}
.btn{
  flex:1;padding:12px 0;
  border:1px solid rgba(200,210,220,.4);
  border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#242c37,#161b22);
  color:#dce4eb;font-size:.95rem;letter-spacing:.14em;
  transition:all .15s;
}
.btn:hover{border-color:rgba(190,220,250,.85);color:#fff;box-shadow:0 0 18px rgba(150,200,255,.26);}
.btn.ghost{background:transparent;color:#a9b6c2;}
.btn.ghost:hover{color:#fff;}
.overlay{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  background:rgba(4,6,9,.78);
  backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.show{opacity:1;pointer-events:auto;}
.modal{
  width:min(390px,90%);
  border:1px solid rgba(242,212,132,.55);
  border-radius:20px;padding:32px 26px 28px;text-align:center;
  background:linear-gradient(165deg,rgba(255,255,255,.07),transparent 42%),#141922;
  box-shadow:0 0 44px rgba(255,200,120,.2),0 24px 64px rgba(0,0,0,.65);
  transform:scale(.9);transition:transform .28s ease;
}
.overlay.show .modal{transform:scale(1);}
.modal h2{font-size:1.55rem;letter-spacing:.34em;color:#ffd76a;text-shadow:0 0 18px rgba(255,200,90,.5);margin-bottom:4px;}
.modal .sub{font-size:.82rem;color:#96a3b0;letter-spacing:.22em;margin-bottom:18px;}
.modal .lines{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
.modal .lines div{font-size:.98rem;color:#c6d0da;}
.modal .lines b{color:#fff;font-variant-numeric:tabular-nums;}
.modal .again{
  width:100%;padding:13px 0;border-radius:12px;cursor:pointer;
  border:1px solid rgba(242,212,132,.55);
  background:linear-gradient(180deg,#2c2520,#1b1613);
  color:#ffd76a;font-size:1rem;letter-spacing:.2em;
  box-shadow:0 2px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);
  transition:all .15s;
}
.modal .again:hover{border-color:rgba(255,220,140,.9);box-shadow:0 0 22px rgba(255,200,110,.35);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title"><span class="dot">◆</span>6×6 數獨</div>
    <div class="clock"><span class="lbl">即時時鐘</span><span id="clock">--:--:--</span></div>
  </div>
  <div class="statbar">
    <span>剩餘空格 <b id="remain">10</b></span>
    <span>錯誤 <b id="errors">0</b></span>
    <span>用時 <b id="timer">00:00</b></span>
  </div>
  <div id="grid" class="grid"></div>
  <div id="hint" class="hint">點擊空格並輸入 1–6，即時判斷正確或錯誤</div>
  <div id="pad" class="pad"></div>
  <div class="actions">
    <button id="erase" class="btn ghost" type="button">✕ 清除</button>
    <button id="newGame" class="btn" type="button">新謎題</button>
  </div>
</div>

<div id="overlay" class="overlay">
  <div class="modal">
    <h2>🎉 完成</h2>
    <div class="sub">S O L V E D</div>
    <div class="lines">
      <div class="trophy">🏆 全部正確！</div>
      <div>完成時間（用時）：<b id="result-time">--:--</b></div>
      <div>完成於：<b id="result-at">--:--:--</b></div>
      <div>錯誤次數：<b id="result-errors">0</b></div>
    </div>
    <button id="again" class="again" type="button">再玩一局</button>
  </div>
</div>

<script>
/* ============ 核心邏輯（無 DOM 依賴，可獨立測試） ============ */
const HOLE_COUNT = 10;

function shuffle(a){
  const arr = a.slice();
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function isValid(b, r, c, v){
  for(let i = 0; i < 6; i++){
    if(b[r][i] === v || b[i][c] === v) return false;
  }
  const br = Math.floor(r / 2) * 2;
  const bc = Math.floor(c / 3) * 3;
  for(let i = 0; i < 2; i++)
    for(let j = 0; j < 3; j++)
      if(b[br + i][bc + j] === v) return false;
  return true;
}

function countSolutions(board, limit){
  limit = limit || 2;
  let count = 0;
  const b = board.map(row => row.slice());
  (function bt(){
    if(count >= limit) return;
    let fr = -1, fc = -1;
    outer:
    for(let r = 0; r < 6; r++)
      for(let c = 0; c < 6; c++)
        if(b[r][c] === 0){ fr = r; fc = c; break outer; }
    if(fr < 0){ count++; return; }
    for(let v = 1; v <= 6; v++){
      if(isValid(b, fr, fc, v)){
        b[fr][fc] = v;
        bt();
        b[fr][fc] = 0;
        if(count >= limit) return;
      }
    }
  })();
  return count;
}

const BASE = [
  [1,2,3,4,5,6],
  [4,5,6,1,2,3],
  [2,3,1,5,6,4],
  [5,6,4,2,3,1],
  [3,1,2,6,4,5],
  [6,4,5,3,1,2]
];

function generateSolution(){
  const p = shuffle([1,2,3,4,5,6]);
  const label = [0, p[0], p[1], p[2], p[3], p[4], p[5]];
  const relabeled = BASE.map(row => row.map(v => label[v]));
  const rowIdx = shuffle([0,1]).concat(shuffle([2,3])).concat(shuffle([4,5]));
  const colIdx = shuffle([0,1,2]).concat(shuffle([3,4,5]));
  const out = [];
  for(let r = 0; r < 6; r++){
    const nr = [];
    for(let c = 0; c < 6; c++) nr.push(relabeled[rowIdx[r]][colIdx[c]]);
    out.push(nr);
  }
  return out;
}

/* 生成挖空 10 格、且保證唯一解的謎題 */
function generatePuzzle(){
  for(let holes = HOLE_COUNT; holes >= 6; holes--){
    const tries = holes === HOLE_COUNT ? 400 : 200;
    for(let a = 0; a < tries; a++){
      const sol = generateSolution();
      const all = [];
      for(let r = 0; r < 6; r++) for(let c = 0; c < 6; c++) all.push([r, c]);
      const chosen = shuffle(all).slice(0, holes);
      const puz = sol.map(row => row.slice());
      chosen.forEach(([r, c]) => { puz[r][c] = 0; });
      if(countSolutions(puz, 2) === 1){
        return { puzzle: puz, solution: sol };
      }
    }
  }
  /* 理論上不會到達：退而求其次用更少空格 */
  const sol = generateSolution();
  const puz = sol.map(row => row.slice());
  puz[0][0] = 0; puz[1][0] = 0; puz[2][0] = 0;
  puz[3][0] = 0; puz[4][0] = 0; puz[5][0] = 0;
  return { puzzle: puz, solution: sol };
}
</script>

<script>
/* ============ DOM 互動 ============ */
const grid = document.getElementById('grid');
const pad = document.getElementById('pad');
const hintEl = document.getElementById('hint');
const clockEl = document.getElementById('clock');
const remainEl = document.getElementById('remain');
const errorsEl = document.getElementById('errors');
const timerEl = document.getElementById('timer');

let puzzle, solution, userBoard;
let correctCount = 0, errors = 0, finished = false;
let startTime = 0, timerInterval = null, selected = null;

function cellElAt(r, c){
  return grid.querySelector('.cell[data-r="' + r + '"][data-c="' + c + '"]');
}

function render(){
  grid.innerHTML = '';
  for(let r = 0; r < 6; r++){
    for(let c = 0; c < 6; c++){
      const d = document.createElement('button');
      d.type = 'button';
      d.className = 'cell';
      d.dataset.r = r;
      d.dataset.c = c;
      if(puzzle[r][c] !== 0){
        d.textContent = puzzle[r][c];
        d.classList.add('given');
      }
      d.addEventListener('click', () => select(r, c));
      grid.appendChild(d);
    }
  }
}

function select(r, c){
  grid.querySelectorAll('.selected').forEach(e => e.classList.remove('selected'));
  const el = cellElAt(r, c);
  el.classList.add('selected');
  selected = { r: r, c: c, editable: puzzle[r][c] === 0 };
}

function inputValue(v){
  if(finished || !selected || !selected.editable) return;
  const { r, c } = selected;
  const el = cellElAt(r, c);
  if(userBoard[r][c] === v && el.classList.contains('ok')) return;
  if(userBoard[r][c] === solution[r][c]) correctCount--;
  userBoard[r][c] = v;
  el.textContent = v;
  el.classList.remove('ok', 'err', 'user');
  if(v === solution[r][c]){
    correctCount++;
    el.classList.add('ok');
    setHint('✓ 正確！繼續加油', 'ok');
  }else{
    errors++;
    void el.offsetWidth; /* 確保震動動畫重播 */
    el.classList.add('err', 'user');
    setHint('✗ 錯誤！此格的正確數字不是 ' + v, 'err');
    updateErrors();
  }
  updateCounts();
  if(correctCount === HOLE_COUNT) complete();
}

function clearCell(){
  if(finished || !selected || !selected.editable) return;
  const { r, c } = selected;
  const el = cellElAt(r, c);
  if(userBoard[r][c] === solution[r][c]) correctCount--;
  userBoard[r][c] = 0;
  el.textContent = '';
  el.classList.remove('ok', 'err', 'user');
  updateCounts();
}

function setHint(text, type){
  hintEl.textContent = text;
  hintEl.className = 'hint' + (type ? ' ' + type : '');
}

function updateCounts(){ remainEl.textContent = Math.max(0, HOLE_COUNT - correctCount); }
function updateErrors(){ errorsEl.textContent = errors; }

function formatDur(ms){
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? pad(h) + ':' + pad(m) + ':' + pad(sec) : pad(m) + ':' + pad(sec);
}

function updateTimer(){ timerEl.textContent = formatDur(Date.now() - startTime); }
function tickClock(){
  clockEl.textContent = new Date().toLocaleTimeString('zh-Hant-TW', { hour12: false });
}

function complete(){
  finished = true;
  clearInterval(timerInterval);
  const total = Date.now() - startTime;
  grid.querySelectorAll('.cell').forEach(e => e.classList.add('done'));
  document.getElementById('result-time').textContent = formatDur(total);
  document.getElementById('result-at').textContent =
    new Date().toLocaleTimeString('zh-Hant-TW', { hour12: false });
  document.getElementById('result-errors').textContent = errors;
  document.getElementById('overlay').classList.add('show');
}

function newGame(){
  finished = false;
  errors = 0;
  correctCount = 0;
  selected = null;
  const gen = generatePuzzle();
  puzzle = gen.puzzle;
  solution = gen.solution;
  userBoard = puzzle.map(row => row.slice());
  render();
  updateCounts();
  updateErrors();
  setHint('點擊空格並輸入 1–6，即時判斷正確或錯誤', '');
  document.getElementById('overlay').classList.remove('show');
  startTime = Date.now();
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer();
}

/* 數字面板 */
for(let v = 1; v <= 6; v++){
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = v;
  b.addEventListener('click', () => inputValue(v));
  pad.appendChild(b);
}

document.getElementById('newGame').addEventListener('click', newGame);
document.getElementById('again').addEventListener('click', newGame);
document.getElementById('erase').addEventListener('click', clearCell);

/* 鍵盤輸入 */
document.addEventListener('keydown', e => {
  if(e.key >= '1' && e.key <= '6'){ inputValue(parseInt(e.key, 10)); }
  else if(e.key === 'Backspace' || e.key === 'Delete' || e.key === '0'){ clearCell(); }
});

/* 即時時鐘（每秒刷新） */
tickClock();
setInterval(tickClock, 1000);

newGame();
</script>
</body>
</html>
