name: Update Vulnerability Feed

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00 更新
  workflow_dispatch:  # 手动触发

permissions:
  contents: write

jobs:
  update-vulns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Update vulnerabilities.json from authoritative sources
        run: |
          pip install .
          python -c "from skill_safety_guard.vuln_feed import update_vulnerabilities; r = update_vulnerabilities(force=True); print(f'Updated: {r.get(\"updated\")}, count: {r.get(\"count\", 0)}, source: {r.get(\"source\", \"?\")}')"

      - name: Copy cache to built-in rules (for repo commit)
        run: |
          python -c "
          import json, shutil, time
          from pathlib import Path
          cache = Path.home() / '.skill-safety-guard' / 'vulnerabilities_cache.json'
          target = Path('src/skill_safety_guard/rules/vulnerabilities.json')
          if cache.exists():
              data = json.loads(cache.read_text(encoding='utf-8'))
              data['_updated_by'] = 'github-actions[bot]'
              target.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
              print(f'Copied {len(data.get(\"vulnerabilities\", []))} vulns to built-in')
          else:
              print('No cache found, skipping')
          "

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/skill_safety_guard/rules/vulnerabilities.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: 更新漏洞庫（權威源 OSV.dev）$(date +%Y-%m-%d)"
            git push
          fi
