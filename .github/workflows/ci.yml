name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Phase 0 verification tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_phase0.py

      - name: Scan the project itself
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 只掃描源代碼，不掃描 tests/fixtures/ （含惡意樣本）
          python scripts/safety-check src/ --output json > safety-report.json || true
          python -c "
          import sys, json
          d = json.load(open('safety-report.json'))
          print('Scan grade:', d['overall_grade'])
          print('Findings:', d['summary']['total'])
          # 在 CI 中，源代碼中不應有 critical/high 問題
          if d['summary']['critical'] > 0 or d['summary']['high'] > 0:
            print(f'ERROR: {d[\"summary\"][\"critical\"]} critical, {d[\"summary\"][\"high\"]} high issues in source code!', file=sys.stderr)
            sys.exit(1)
          print('Source scan OK')
          "

      - name: Upload safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report-${{ matrix.os }}-${{ matrix.python-version }}
          path: safety-report.json

  lint:
    name: Lint YAML rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml yamllint
      - name: Lint YAML files
        run: |
          # 簡單的 YAML lint（語法 + 必需字段）
          python -c "
          import yaml
          import sys
          from pathlib import Path
          errors = []
          for f in Path('rules').glob('*.yaml'):
              try:
                  data = yaml.safe_load(f.read_text(encoding='utf-8'))
                  rules = data.get('rules', []) if isinstance(data, dict) else []
                  if not rules and 'whitelisted' not in str(data):
                      errors.append(f'{f}: empty rules')
                  for r in rules:
                      for field in ['id', 'name', 'pattern', 'severity', 'confidence']:
                          if field not in r:
                              errors.append(f'{f}: rule missing {field}')
                      if r.get('severity') not in ['critical', 'high', 'medium', 'low']:
                          errors.append(f'{f}: rule {r.get(\"id\")} has invalid severity')
                      if r.get('confidence') not in ['high', 'medium', 'low']:
                          errors.append(f'{f}: rule {r.get(\"id\")} has invalid confidence')
              except yaml.YAMLError as e:
                  errors.append(f'{f}: YAML error: {e}')
          if errors:
              print('Errors found:')
              for e in errors:
                  print('  -', e)
              sys.exit(1)
          else:
              print(f'All {sum(1 for _ in Path(\"rules\").glob(\"*.yaml\"))} YAML files OK')
          "